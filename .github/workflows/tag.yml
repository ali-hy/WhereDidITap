name: Tag

# Stage-0 tagging (LLD §4.17 "Stage-0 tagging", D-12, A-407, A-408): a merged release/* pull request
# into the default branch is tagged on its merge commit; a hotfix pull request is tagged on its head
# when dispatched with its number. `verify` runs every check, check (i) included, with read-only
# permissions; `tag` holds the only write permission and runs no repository code. The stage-1 LLD
# replaces this with the App-based chain.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Hotfix pull request number
        required: true
        type: number

permissions: {}

env:
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags and history, for the ancestry checks
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify the pull request and run check (i) (tagRelease.sh)
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            bash tools/ci/tagRelease.sh hotfix "$PR_FROM_INPUT"
          else
            bash tools/ci/tagRelease.sh release "$PR_FROM_EVENT"
          fi

  tag:
    name: tag
    needs: verify
    if: needs.verify.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag through the API
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-hotfix\.[0-9]+)?$ ]] || { echo "invalid tag: $TAG" >&2; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit: $COMMIT" >&2; exit 1; }
          gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" >/dev/null
          echo "tagged $TAG on $COMMIT"
