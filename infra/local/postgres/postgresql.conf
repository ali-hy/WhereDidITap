# F-170: the laptop's Postgres configuration (mounted read-only at /etc/budmon/postgresql.conf).
# listen_addresses comes from BUDMON_LISTEN_ADDRESSES through `-c` (budmon-entrypoint.sh).
data_directory = '/var/lib/postgresql/data/pgdata'

# Logging (D-24 rule 8): no statement text, no parameter values.
log_destination = 'stderr'
log_error_verbosity = terse
log_min_error_statement = panic
log_statement = none
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# Connections and TLS.
max_connections = 100
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/run/secrets/TLS_CERT'
ssl_key_file = '/run/secrets/TLS_KEY'

# WAL: no off-site archiving in stage 0 (D-30).
wal_level = replica
archive_mode = off

# Extensions (F-15).
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track_utility = off

shared_buffers = 512MB
