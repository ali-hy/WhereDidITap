# F-195 step 4 (A-449): the rehearsal overlay for budmon-main, added by the harness's composeArgs.
# Nothing in it is used on the laptop. It points api, worker-general and migrate at the harness's
# fakes (host-gateway, trusting the harness CA) and adds the S3 test image over TLS (A-450).
# A-492: BUDMON_RELEASE is the release the images are (REHEARSAL_RELEASE, set by the harness);
# the image tag stays `rehearsal`.
# REHEARSAL_CA_DIR is <workDir>/ca, so ${REHEARSAL_CA_DIR}/.. is <workDir>.

x-rehearsal-env: &rehearsal-env
  APP_ENV: rehearsal
  KMS_PROVIDER: local
  SENTRY_DSN: https://rehearsal@sentry.rehearsal.invalid:8445/1
  NODE_EXTRA_CA_CERTS: /run/rehearsal/ca.crt

x-rehearsal-ca: &rehearsal-ca
  type: bind
  source: ${REHEARSAL_CA_DIR}/ca.crt
  target: /run/rehearsal/ca.crt
  read_only: true

services:
  api:
    environment:
      <<: *rehearsal-env
      BUDMON_RELEASE: ${REHEARSAL_RELEASE:?REHEARSAL_RELEASE is not set}
    extra_hosts:
      - "oauth2.googleapis.com:host-gateway"
      - "www.googleapis.com:host-gateway"
      - "gmail.googleapis.com:host-gateway"
      - "pubsub.googleapis.com:host-gateway"
      - "sentry.rehearsal.invalid:host-gateway"
    volumes:
      - *rehearsal-ca

  worker-general:
    environment:
      <<: *rehearsal-env
      BUDMON_RELEASE: ${REHEARSAL_RELEASE:?REHEARSAL_RELEASE is not set}
      FX_PROVIDER: live
      FX_PRIMARY_BASE_URL: https://fx.rehearsal.invalid:8444/oxr
      FX_FALLBACK_BASE_URL: https://fx.rehearsal.invalid:8444/fawaz/{date}
      FX_FALLBACK_MIRROR_URL: https://fx.rehearsal.invalid:8444/mirror/{date}
    extra_hosts:
      - "fx.rehearsal.invalid:host-gateway"
      - "sentry.rehearsal.invalid:host-gateway"
    volumes:
      - *rehearsal-ca

  migrate:
    environment:
      <<: *rehearsal-env
      BUDMON_RELEASE: ${REHEARSAL_RELEASE:?REHEARSAL_RELEASE is not set}
    extra_hosts:
      - "sentry.rehearsal.invalid:host-gateway"
    volumes:
      - *rehearsal-ca

  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    command:
      [
        "--port",
        ":7070",
        "--cert",
        "/run/rehearsal/s3.crt",
        "--key",
        "/run/rehearsal/s3.key",
        "posix",
        "/data",
      ]
    environment:
      ROOT_ACCESS_KEY: rehearsal-access-key
      ROOT_SECRET_KEY: rehearsal-secret-key
    networks:
      egress:
        aliases: [s3.rehearsal.invalid]
    volumes:
      - type: bind
        source: ${REHEARSAL_CA_DIR}/../s3
        target: /data
      - type: bind
        source: ${REHEARSAL_CA_DIR}/s3.crt
        target: /run/rehearsal/s3.crt
        read_only: true
      - type: bind
        source: ${REHEARSAL_CA_DIR}/s3.key
        target: /run/rehearsal/s3.key
        read_only: true

# A-478: the rehearsal's own capture network, never the laptop's budmon_capture_db.
networks:
  capture-db:
    external: true
    name: budmon_rehearsal_capture_db
